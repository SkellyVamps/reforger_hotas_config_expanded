name: Apply Cheat Sheet Button Style

on:
  push:
    branches:
      - style/cheatsheet-download-button
    paths:
      - 'scripts/style_cheatsheet_button.py'
      - '.github/workflows/apply-cheatsheet-button-style.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: style/cheatsheet-download-button
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python scripts/style_cheatsheet_button.py
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.vue
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Match cheat sheet download button style"
            git push origin HEAD:style/cheatsheet-download-button
          fi
