name: Apply Cheat Sheet UI

on:
  push:
    branches:
      - feature/cheat-sheet
    paths:
      - '.github/workflows/apply-cheatsheet-ui.yml'
      - 'scripts/trigger-cheatsheet-ui.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/cheat-sheet

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply UI patch
        run: python3 scripts/add_cheatsheet_ui.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate build
        run: npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.vue
          if git diff --cached --quiet; then
            echo "No App.vue changes to commit"
          else
            git commit -m "Add downloadable cheat sheet button"
            git push origin HEAD:feature/cheat-sheet
          fi
