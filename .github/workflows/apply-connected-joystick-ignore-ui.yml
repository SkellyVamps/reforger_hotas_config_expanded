name: Apply Connected Joystick Ignore UI

on:
  push:
    branches:
      - fix/connected-joystick-ignore-ui
    paths:
      - 'scripts/move_ignore_controls_to_connected.py'
      - '.github/workflows/apply-connected-joystick-ignore-ui.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/connected-joystick-ignore-ui

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python scripts/move_ignore_controls_to_connected.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.vue
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Move ignore controls to Connected Joysticks"
            git push origin HEAD:fix/connected-joystick-ignore-ui
          fi
