name: Apply Gamepad Ignore Controls

on:
  push:
    branches:
      - fix/show-ignore-gamepad-controls
    paths:
      - 'scripts/fix_ignore_gamepad_controls.py'
      - '.github/workflows/apply-ignore-gamepad-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/show-ignore-gamepad-controls

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python scripts/fix_ignore_gamepad_controls.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.vue
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Show ignore controls for detected Gamepad API devices"
            git push origin HEAD:fix/show-ignore-gamepad-controls
          fi
