name: Apply Sight Deploy and Ignore Gamepads

on:
  push:
    branches:
      - feature/helicopter-sight-ignore-gamepads
    paths:
      - 'scripts/apply_sight_ignore_gamepads.py'
      - '.github/workflows/apply-sight-ignore-gamepads.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/helicopter-sight-ignore-gamepads

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python scripts/apply_sight_ignore_gamepads.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.vue
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add helicopter sight deploy and ignored gamepad devices"
            git push origin HEAD:feature/helicopter-sight-ignore-gamepads
          fi
