name: Apply Weapon Cycle Debounce

on:
  push:
    branches:
      - feature/weapon-cycle-debounce
    paths:
      - 'scripts/apply_weapon_cycle_debounce.py'
      - '.github/workflows/apply-weapon-cycle-debounce.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/weapon-cycle-debounce

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python scripts/apply_weapon_cycle_debounce.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.vue
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Throttle weapon cycle inputs"
            git push origin HEAD:feature/weapon-cycle-debounce
          fi
