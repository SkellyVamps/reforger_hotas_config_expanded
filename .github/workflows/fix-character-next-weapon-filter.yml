name: Fix Character Next Weapon Filter

on:
  push:
    branches:
      - fix/character-next-weapon-filter
    paths:
      - 'scripts/remove_character_weapon_hold_duration.py'
      - '.github/workflows/fix-character-next-weapon-filter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/character-next-weapon-filter
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/remove_character_weapon_hold_duration.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.vue
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix CharacterNextWeapon single-click filter"
            git push origin HEAD:fix/character-next-weapon-filter
          fi
