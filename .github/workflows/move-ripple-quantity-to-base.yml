name: Move Ripple Quantity To Base Actions

on:
  push:
    branches:
      - feature/ripple-quantity-base-action
    paths:
      - 'scripts/move_ripple_quantity_to_base.py'
      - '.github/workflows/move-ripple-quantity-to-base.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ripple-quantity-base-action
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/move_ripple_quantity_to_base.py
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.vue
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Expose turret ripple quantity as a base action"
            git push origin HEAD:feature/ripple-quantity-base-action
          fi
