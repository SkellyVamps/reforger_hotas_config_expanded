name: Preview Sol-R PDF Readability

on:
  push:
    branches:
      - feature/solr-readability
    paths:
      - '.github/workflows/preview-solr-readability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Download PDF template
        run: |
          curl -L --fail --retry 3 \
            "https://www.dropbox.com/scl/fi/83b8mt28h3ssy7nl7herm/Elite-Dangerous-Thrustmaster-Sol-R2-Template.pdf?rlkey=j8mtb9j4wly57jd5ejy8q0ni9&dl=1" \
            -o template.pdf

      - name: Generate readability preview
        run: |
          cat > preview.mjs <<'EOF'
          import fs from 'node:fs'
          import { PDFDocument, StandardFonts } from 'pdf-lib'

          const bytes = fs.readFileSync('template.pdf')
          const pdf = await PDFDocument.load(bytes)
          const form = pdf.getForm()
          const target = [335.053, 594.469]
          let best = null
          for (const field of form.getFields()) {
            const widget = field.acroField.getWidgets()[0]
            if (!widget) continue
            const rect = widget.getRectangle()
            const center = [rect.x + rect.width / 2, rect.y + rect.height / 2]
            const d = Math.hypot(target[0] - center[0], target[1] - center[1])
            if (!best || d < best.d) best = { name: field.getName(), d }
          }
          if (!best || best.d > 4) throw new Error('Could not resolve Sol-R [R] axis0 field')

          const field = form.getTextField(best.name)
          field.enableMultiline()
          field.acroField.setDefaultAppearance('/Helv 5.5 Tf 0 0 0 rg')
          field.setText('Helicopter Cyclic Forward / Back /\nTurret Aim Up / Down')
          const font = await pdf.embedFont(StandardFonts.Helvetica)
          form.updateFieldAppearances(font)
          fs.writeFileSync('solr-readability-preview.pdf', await pdf.save())
          EOF
          node preview.mjs

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: solr-readability-preview
          path: solr-readability-preview.pdf
