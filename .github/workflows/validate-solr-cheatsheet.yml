name: Validate Sol-R Cheat Sheet

on:
  push:
    branches:
      - feature/sol-r-cheatsheet
    paths:
      - 'src/cheatsheet.ts'
      - 'src/solrCheatsheet.ts'
      - '.github/workflows/validate-solr-cheatsheet.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build
        run: npm run build
